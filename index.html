    <script>
      (function() {
        if ('serviceWorker' in navigator) {
          // Detect if embedded in an iframe (e.g. AI Studio preview environment)
          var isEmbeddedInIframe = false;
          try {
            isEmbeddedInIframe = window.self !== window.top;
          } catch (e) {
            isEmbeddedInIframe = true;
          }

          // Service Workers are partitioned / disallowed in third-party embedded iframes
          if (!isEmbeddedInIframe) {
            window.addEventListener('load', function() {
              navigator.serviceWorker.register('/sw.js', { scope: '/' })
                .then(function(registration) {
                  // Safe periodic update check that catches network failures cleanly
                  setInterval(function() {
                    try {
                      registration.update().catch(function() {});
                    } catch (e) {}
                  }, 120000);
                })
                .catch(function(err) {
                  console.info('ServiceWorker registration deferred:', err && err.message ? err.message : err);
                });
            });
          }
        }
      })();
