    <script>
      (function() {
        if ('serviceWorker' in navigator) {
          var isEmbeddedInIframe = false;
          try {
            isEmbeddedInIframe = window.self !== window.top;
          } catch (e) {
            isEmbeddedInIframe = true;
          }

          if (!isEmbeddedInIframe) {
            window.addEventListener('load', function() {
              navigator.serviceWorker.register('/sw.js', { scope: '/' })
                .then(function(registration) {
                  setInterval(function() {
                    try {
                      registration.update().catch(function() {});
                    } catch (e) {}
                  }, 120000);
                })
                .catch(function(err) {
                  console.info('ServiceWorker registration deferred:', err && err.message ? err.message : err);
                });
            });
          }
        }
      })();

      // دالة الخروج والعودة إلى واجهة المتجر الرئيسية
      function returnToStoreMain() {
        try {
          var merchant = document.getElementById('merchant-dashboard');
          var store = document.getElementById('main-store-view');
          if (merchant) merchant.style.display = 'none';
          if (store) store.style.display = 'block';
          window.dispatchEvent(new CustomEvent('store:return-to-main'));
        } catch (e) {
          console.error('Error in returnToStoreMain:', e);
        }
      }
      window.returnToStoreMain = returnToStoreMain;
    </script>
