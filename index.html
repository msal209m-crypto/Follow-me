<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="HandheldFriendly" content="true" />
    <meta name="MobileOptimized" content="width" />
    <title>قريتي - تطبيق التجارة المحلية المتكامل</title>
    <meta name="description" content="تطبيق قريتي الشامل لتجارة القرى والمتاجر المحلية مع بوابة الدخول المستقلة وعزل بيانات التجار ومواقيت الأذان" />
    <meta property="og:title" content="قريتي - تطبيق التجارة المحلية المتكامل" />
    <meta property="og:description" content="تطبيق قريتي الشامل لتجارة القرى والمتاجر المحلية مع بوابة الدخول المستقلة وعزل بيانات التجار ومواقيت الأذان" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    
    <link
      rel="manifest"
      href="/manifest.json"
    />
    <meta name="theme-color" content="#020617" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="قريتي" />
    <link
      rel="apple-touch-icon"
      href="/icon.png"
    />

    <script>
      (function() {
        if ('serviceWorker' in navigator) {
          var isEmbeddedInIframe = false;
          try {
            isEmbeddedInIframe = window.self !== window.top;
          } catch (e) {
            isEmbeddedInIframe = true;
          }

          if (!isEmbeddedInIframe) {
            window.addEventListener('load', function() {
              navigator.serviceWorker.register('/sw.js', { scope: '/' })
                .then(function(registration) {
                  setInterval(function() {
                    try {
                      registration.update().catch(function() {});
                    } catch (e) {}
                  }, 120000);
                })
                .catch(function(err) {
                  console.info('ServiceWorker registration deferred:', err && err.message ? err.message : err);
                });
            });
          }
        }
      })();

      // دالة الخروج والعودة إلى واجهة المتجر الرئيسية
      function returnToStoreMain() {
        try {
          var merchant = document.getElementById('merchant-dashboard');
          var store = document.getElementById('main-store-view');
          if (merchant) merchant.style.display = 'none';
          if (store) store.style.display = 'block';
          window.dispatchEvent(new CustomEvent('store:return-to-main'));
        } catch (e) {
          console.error('Error in returnToStoreMain:', e);
        }
      }
      window.returnToStoreMain = returnToStoreMain;

      // منع التكبير والتصغير اليدوي بالأصابع (Pinch-to-Zoom) والنقر المزدوج على الأجهزة الذكية
      (function() {
        document.addEventListener('gesturestart', function(e) {
          e.preventDefault();
        }, { passive: false });
        document.addEventListener('gesturechange', function(e) {
          e.preventDefault();
        }, { passive: false });
        document.addEventListener('gestureend', function(e) {
          e.preventDefault();
        }, { passive: false });

        var lastTouchEnd = 0;
        document.addEventListener('touchend', function(e) {
          var now = Date.now();
          if (now - lastTouchEnd <= 300) {
            var tag = e.target && e.target.tagName;
            if (tag !== 'INPUT' && tag !== 'TEXTAREA' && tag !== 'SELECT') {
              e.preventDefault();
            }
          }
          lastTouchEnd = now;
        }, { passive: false });
      })();
    </script>
  </head>
  <body class="font-sans antialiased bg-slate-950 text-slate-100 selection:bg-emerald-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
